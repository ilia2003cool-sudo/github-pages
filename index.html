 сообщество.</p></article><article><svg viewBox=\"0 0 180 95\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"m35 17 74-7 7 76-74 7z\"/><path d=\"m51 35 43-4M53 49l34-3M55 64l20-2\"/><path d=\"m121 49 12 12 23-29\" stroke-width=\"4\"/></svg><h3>Пробуем<br><em>в деле.</em></h3><p>Создаем образовательные проекты и работаем с реальными задачами — чтобы понимать ожидания работодателей.</p></article><article><svg viewBox=\"0 0 180 95\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M25 87h35V64h35V40h35V15h26M119 4l11 11-11 11\"/><circle cx=\"48\" cy=\"30\" r=\"12\"/><path d=\"m40 48 17-5 16 8\"/></svg><h3>Делаем шаг<br><em>в профессию.</em></h3><p>Знакомим студентов, бренды и агентства: от первого контакта до стажировки и начала карьеры.</p></article></div></div></section><section class=\"about-community container\" aria-labelledby=\"about-community-title\"><div class=\"about-community-copy\"><h2 id=\"about-community-title\">В профессию —<br><em>не в одиночку.</em></h2><p class=\"about-community-intro\">Рядом — люди, которые<br><strong>уже делают индустрию.</strong></p><ul class=\"about-support-list\"><li><span aria-hidden=\"true\"><svg viewBox=\"0 0 32 32\" width=\"32\" height=\"32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 25 25 7M7 7h18v18\"/></svg></span><div><h3>Делятся опытом</h3><p>Эксперты выступают на наших проектах.</p></div></li><li><span aria-hidden=\"true\"><svg viewBox=\"0 0 32 32\" width=\"32\" height=\"32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 3v26M3 16h26M7 7l18 18M7 25 25 7\"/></svg></span><div><h3>Поддерживают идеи</h3><p>Помогают инициативам сообщества и первым профессиональным шагам.</p></div></li><li><span aria-hidden=\"true\"><svg viewBox=\"0 0 32 32\" width=\"32\" height=\"32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 16h26M9 10l-6 6 6 6m14-12 6 6-6 6\"/></svg></span><div><h3>Находят друг друга</h3><p>Некоторые партнеры встречают здесь будущих стажеров и сотрудников.</p></div></li></ul></div><div class=\"about-community-map\" aria-label=\"Профессиональное сообщество через cultcomms поддерживает новое поколение коммуникаторов\"><ul><li>Эксперты</li><li>Агентства</li><li>Ассоциации</li><li>Преподаватели</li></ul><span class=\"about-map-line\" aria-hidden=\"true\"></span><div class=\"about-map-brand\">cult<span>comms</span></div><span class=\"about-map-line\" aria-hidden=\"true\"></span><div class=\"about-generation\"><span class=\"generation-spark\" aria-hidden=\"true\"><svg viewBox=\"0 0 32 32\" width=\"32\" height=\"32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 3v26M3 16h26M7 7l18 18M7 25 25 7\"/></svg></span><h3>Новое<br><em>поколение</em><span>коммуникаторов</span></h3></div></div></section><section class=\"about-testimonials\" aria-labelledby=\"about-reviews-title\"><div class=\"container\"><h2 id=\"about-reviews-title\">Что о нас <em>говорят.</em></h2>\n<article class=\"about-testimonial\"><header class=\"about-review-author\"><img src=\"./assets/optimized/a47b0066804059b3.webp\" alt=\"Екатерина Пикерсгиль\" width=\"640\" height=\"640\" loading=\"lazy\" decoding=\"async\"><div><h3>Екатерина Пикерсгиль</h3><p>CEO, Win2Win Communications</p></div></header>\n<div class=\"about-review-content\"><blockquote>«cultcomms — сильное сообщество молодых коммуникаторов»</blockquote>\n<details open><summary>Почему вы выбрали cultcomms в качестве партнёра для бренда Fresh Bar?<span aria-hidden=\"true\">+</span></summary><div class=\"about-answer\"><p>cultcomms - сильное сообщество молодых коммуникаторов, которому удалось создать вокруг себя творческую среду и объединить талантливых студентов и начинающих специалистов. Уже сегодня они становятся лидерами мнений в своём окружении, а завтра именно им предстоит формировать новые тренды и определять, как бренды будут выстраивать коммуникацию с потребителями.</p><p>Для Fresh Bar, чья аудитория - поколения зумеров и альфа, такое партнёрство выглядит абсолютно органичным. Молодые люди ценят эмоции, свободу самовыражения и бренды, которые говорят с ними на одном языке. Поэтому сотрудничество с cultcomms - это настоящий win-win. Fresh Bar получает возможность выстраивать живой диалог со своей аудиторией, а участники - взаимодействовать с брендом в естественном и интересном формате.</p></div></details>\n<details><summary>Может ли молодое поколение выступать хорошим партнёром в поиске решений для аудиторий зумеров и альфа?<span aria-hidden=\"true\">+</span></summary><div class=\"about-answer\"><p>Конечно, да. Сегодня сильные бренды строят коммуникацию не в формате монолога, а через постоянный диалог со своей аудиторией. Чтобы оставаться актуальными, им важно разделять с ней общий культурный код, понимать её ценности и создавать новые смыслы вместе.</p><p>Кроме того, именно среди поколений зумеров и альфа, сегодня рождаются многие тренды, которые затем становятся массовыми. Благодаря своему взгляду на мир и готовности экспериментировать молодые люди способны предлагать свежие идеи и нестандартные решения. Их вовлечение помогает создавать более искренние и живые коммуникации.</p></div></details></div></article>\n</div></section></div>"}}),me==="/work"&&d.jsxs("div",{children:[d.jsx("div",{dangerouslySetInnerHTML:{__html:"<div class=\"cc-work-page\"><section class=\"work-hero container\"><a class=\"work-back\" href=\"?page=home\">← На главную</a><h1>Работа с <em>cultcomms</em></h1><p class=\"work-lead\">Переводим ваш бриф<br><span>на молодежный язык.</span></p><a class=\"work-cta\" href=\"#contacts\">Обсудить задачу <span aria-hidden=\"true\">↗</span></a><div c }

.home-team{background:#c8f56a;color:#202125;padding:48px 0 46px;overflow:hidden}
.home-team-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:24px}.home-team h2{font-size:clamp(48px,5.8vw,78px);font-weight:400;letter-spacing:-.065em;line-height:.95}.home-team h2 .serif{color:#7450a7}.home-team-link{font-size:13px;border-bottom:1px solid #202125;padding-bottom:7px;white-space:nowrap;margin-bottom:8px}.home-team-link:focus-visible{outline:2px solid #7450a7;outline-offset:6px}
.team-ribbon-stage{position:relative;padding:24px 14px 20px}.team-ribbon{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.team-ribbon-path{stroke-dasharray:var(--ribbon-length,0);stroke-dashoffset:var(--ribbon-offset,0)}
.home-team-grid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:64px;align-items:start}.home-member-slot:nth-child(2){padding-top:32px}.home-member-slot:nth-child(3){padding-top:12px}
.home-member{background:#f6f3eb;padding:12px 12px 24px;border:1px solid #20212518;border-radius:4px;box-shadow:0 16px 32px #31421024;transform:rotate(-3deg);transition:transform .65s cubic-bezier(.2,.7,.2,1),opacity .65s,box-shadow .3s}.home-member-slot:nth-child(2) .home-member{transform:rotate(3deg)}.home-member-slot:nth-child(3) .home-member{transform:rotate(-2deg)}
.home-member-photo{aspect-ratio:4/4.3;overflow:hidden;background:#ddd8d3}.home-member-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;filter:grayscale(1);transition:filter .4s,transform .6s}
.home-member-caption{padding:23px 10px 0}.home-member h3{font-size:clamp(19px,1.8vw,27px);font-weight:500;letter-spacing:-.04em;line-height:1.1;margin:0 0 10px}.home-member p{font-size:12px;line-height:1.5;color:#555650;max-width:220px;margin:0}

@media(hover:hover){.home-member:hover{transform:translateY(-8px) rotate(0deg)!important;box-shadow:0 24px 42px #31421030}.home-member:hover img{filter:grayscale(0);transform:scale(1.025)}}
@media(max-width:1000px) and (min-width:701px){.home-team-grid{gap:28px}.home-member{padding:8px 8px 20px}.home-member-caption{padding:18px 5px 0}.home-member h3{font-size:21px}}
@media(max-width:700px){.home-team{padding:40px 0 42px}.home-team-heading{align-items:flex-start;gap:18px;margin-bottom:22px}.home-team h2{font-size:clamp(48px,10vw,70px)}.home-team-link{font-size:11px;margin-top:10px}.team-ribbon-stage{padding:16px 10px 16px 34px}.home-team-grid{grid-template-columns:1fr;gap:40px;max-width:390px;margin:auto}.home-member-slot:nth-child(n){padding-top:0}.home-member{padding:12px 12px 24px}.home-member h3{font-size:26px}.home-member p{font-size:13px}.home-member-photo{aspect-ratio:4/4.3}}

.home-team>.container{max-width:1180px}
</style><script id="cc-team-ribbon-js">
(()=>{let mounted=false;function mount(){const section=document.getElementById('home-team');if(!section||mounted)return;mounted=true;const stage=section.querySelector('.team-ribbon-stage'),svg=stage.querySelector('svg'),path=svg.querySelector('path'),slots=[...stage.querySelectorAll('.home-member-slot')],reduced=matchMedia('(prefers-reduced-motion:reduce)');let frame=0,visible=false,length=0;
const cards=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){e.target.classList.add('is-seen');cards.unobserve(e.target)}},{threshold:.12});section.classList.add('team-motion-ready');section.querySelectorAll('.home-member').forEach(c=>cards.observe(c));
function draw(){frame=0;const r=section.getBoundingClientRect(),progress=reduced.matches?1:Math.max(0,Math.min(1,(innerHeight*.85-r.top)/Math.max(1,r.height*.5+innerHeight*.35)));path.style.setProperty('--ribbon-offset',String(length*(1-progress)))}
function schedule(){if(visible&&!frame)frame=requestAnimationFrame(draw)}
function layout(){const r=stage.getBoundingClientRect(),mobile=innerWidth<=700;svg.setAttribute('viewBox','0 0 '+r.width+' '+r.height);const points=slots.map(s=>{const b=s.getBoundingClientRect();return{x:b.left-r.left+b.width/2,y:b.top-r.top+80}});let d;if(mobile){const ys=slots.map(s=>{const b=s.getBoundingClientRect();return b.top-r.top+b.height/2});d='M 60 0 C -5 60, 14 '+(ys[0]-90)+', 20 '+ys[0];for(let i=1;i<ys.length;i++)d+=' C 75 '+(ys[i-1]+110)+', -35 '+(ys[i]-110)+', 20 '+ys[i];d+=' Q 10 '+(r.height-20)+' 75 '+r.height}else{const[a,b,c]=points;d='M 0 '+(a.y-30)+' C '+(a.x*.5)+' '+(a.y-100)+', '+(a.x*.5)+' '+a.y+', '+a.x+' '+a.y+' C '+(a.x+180)+' '+(a.y+370)+', '+(b.x-140)+' '+(b.y+360)+', '+b.x+' '+b.y+' C '+(b.x+100)+' '+(b.y-190)+', '+(c.x-100)+' '+(c.y-170)+', '+c.x+' '+c.y+' Q '+(r.width-25)+' '+(c.y+180)+' '+r.width+' '+(c.y+90)}path.setAttribute('d',d);length=path.getTotalLength();path.style.setProperty('--ribbon-length',String(length));draw()}
const observer=new IntersectionObserver(e=>{visible=e[0].isIntersecting;if(visible)schedule()},{rootMargin:'100px'});observer.observe(section);new ResizeObserver(layout).observe(stage);addEventListener('scroll',schedule,{passive:true});addEventListener('resize',layout,{passive:true});reduced.addEventListener('change',layout);layout()}

<style id="cc-locker">
.site-ready{position:relative}.header{position:relative;z-index:6}.hero{z-index:2}

(()=>{
const colors=['#b79df2','#eee9df','#c8f56a','#7952b0'];
const caseContent=[{"title":"Старт карьеры","subtitle":"Как выбрать конкурс, который даст больше, чем диплом","meta":"Собственный проект · 2023 и 2025","body":"\n<p class=\"case-lead\">Конкурсов много. Понять, какой подходит именно тебе, сложнее. Мы собрали календарь и рейтинги, чтобы помочь студентам находить возможности для профессионального старта.</p>\n<h4>Задача</h4><p>Информация о студенческих конкурсах разбросана по разным площадкам. Сроки легко пропустить, условия — перепутать, а пользу участия не всегда можно оценить по анонсу. Мы решили собрать эти возможности в одном месте и дать студентам ориентиры для выбора.</p>\n<h4>Что сделали</h4><p>Придумали и реализовали «Старт карьеры»: сайт с календарём, рейтингом конкурсов и рейтингом вузов.</p><p>Для оценки конкурсов использовали сведения от организаторов и информацию с официальных страниц. Анализировали полезность, удобство, открытость и доступность участия.</p><p>В рейтинге вузов учитывали победителей, представлявших университет, и авторитетность конкурсов, в которых они добились успеха.</p>\n<h4>Результат</h4><p>Первый выпуск проекта вышел в 2023 году. Второе издание, опубликованное в мае 2025 года, объединило <strong>32 конкурса и мероприятия с возможностями для студентов.</strong></p><p>Вместо разрозненных анонсов — единый инструмент, который помогает сравнивать возможности и планировать участие.</p>\n<div class=\"case-role\"><h4>Наша роль</h4><p>Идея, концепция, сбор данных, методика, анализ и реализация проекта.</p></div><a class=\"case-external-link\" href=\"https://cultcomms.ru/career_start\" target=\"_blank\" rel=\"noopener noreferrer\">Перейти в «Старт карьеры» <span aria-hidden=\"true\">↗</span></a>"},{"title":"Student Baltic Weekend","subtitle":"Студенты задают вопросы. Эксперты проходят проверку.","meta":"Бизнес-игра от cultcomms · сентябрь 2025","body":"\n<p class=\"case-lead\">Что будет, если студенты начнут нанимать руководителей агентств, выбирать их тендерные предложения и решать, достойна ли их история публикации? Мы предложили организаторам Student Baltic Weekend проверить это на сцене.</p>\n<h4>Задача</h4><p>Показать молодым специалистам реальную практику коммуникационной индустрии — через участие, юмор и живое взаимодействие с экспертами.</p>\n<h4>Идея</h4><p>Поменять привычные роли. Студенты становятся работодателями, клиентами и журналистами. Эксперты оказываются на стороне тех, кому нужно убедить, ответить на возражения и защитить своё решение.</p>\n<h4>Как это работало</h4><p>Начали с квиза из <strong>20 вопросов.</strong> Участники с лучшими результатами вышли на сцену, где их ждали три раунда.</p>\n<ul class=\"case-list\"><li><strong>Собеседование.</strong> Студенты нанимают специалиста, а приглашённый эксперт проходит интервью.</li><li><strong>Тендер.</strong> Студенты выступают заказчиками, эксперт представляет агентство и защищает предложение.</li><li><strong>Питчинг.</strong> Студенты становятся журналистами, которым эксперт должен предложить тему публикации. Но есть нюанс: материал заведомо абсурдный.</li></ul>\n<p>Один из учебных брифов — вымышленный шампунь, вызывающий облысение. Эксперту предстояло найти убедительные аргументы в пользу продукта и заинтересовать редакцию. Через юмор участники наблюдали вполне реальные профессиональные приёмы: поиск инфоповода, аргументацию и работу с возражениями.</p>\n<h4>Результат</h4><div class=\"case-numbers\"><p><strong>300</strong> человек одновременно участвовали в нашей сессии</p><p><strong>+100</strong> подписчиков канала cultcomms за день после сессии</p></div><p>Спикеры выразили желание участвовать в следующих проектах команды.</p>\n<div class=\"case-role\"><h4>Наша роль</h4><p>Инициатива, концепция сессии, игровые механики, задания, работа со спикерами и проведение. Сессия проходила внутри Student Baltic Weekend.</p></div>"},{"title":"АКОС","subtitle":"Молодёжный трек, в котором профессию можно попробовать","meta":"Стратегические коммуникации. Идеи & Инсайты · 2025–2026","body":"\n<p class=\"case-lead\">Мы сами предложили организаторам форума АКОС идею молодёжного трека и два года подряд реализовывали его под ключ. Создавали программу, в которой студенты не только слушают экспертов, но и решают задачи, задают неудобные вопросы и проверяют свои идеи.</p>\n<h4>Задача</h4><p>Помочь студентам разобраться в выбранной профессии через прямой контакт с индустрией. Соединить профессиональный разговор с форматами, в которых хочется участвовать.</p>\n<h4 class=\"case-year\">2026 · Бренд, ИИ и вопросы под мемами</h4><h5>Fresh Bar: бриф решает бутылочка</h5><p>Продукт стал частью механики образовательной сессии. Участники крутили бутылочку и получали задание с дополнительными вводными.</p><p>В зависимости от результата нужно было придумать мероприятие, кампанию или продуктовую идею. Ограничения усложняли задачу: например, нельзя использовать VK Видео или приглашать блогеров.</p><p>Бренд предоставил исходную информацию, а cultcomms разработал механику проведения. Участники представляли решения под выпавшие условия; представители Fresh Bar участвовали в оценке.</p>\n<h5>Как ИИ меняет карьерные перспективы</h5><p>Илья Свешников, группхэд исследований и аналитики cultcomms, представил исследование о представлениях студентов о профессиях в креативных индустриях, ожиданиях экспертов от начинающих специалистов и влиянии ИИ на карьерный старт.</p><p>В центре обсуждения — два вывода исследования: портфолио само по себе перестаёт быть достаточным подтверждением компетенций, а пространство стартовых задач, на которых раньше учились новички, сокращается.</p>\n<h5>Bingo-talk: выбираешь мем — открываешь вопрос</h5><p>Студент-ведущий, четыре эксперта и табло со скрытыми вопросами. Каждый вопрос закрывал мем, который подсказывал его тему — например, кризисный PR.</p><p>Эксперты выбирали ячейки, а знакомая игровая механика становилась поводом для разговора о профессиональной практике. Программу также дополнила серия коротких лекций от экспертов.</p>\n<h4 class=\"case-year\">2025 · От личного бренда до защиты перед клиентом</h4><p>Собрали четыре блока, раскрывающих профессию с разных сторон:</p><ul class=\"case-list\"><li>Воркшоп по личному бренду от приглашённого спикера.</li><li>Лекции о профессиональных провалах и выводах из них.</li><li>Образовательный круглый стол о перспективах студента.</li><li>«Дебаттл» — защита решений по короткому брифу.</li></ul><p>В «Дебаттле» студенты представляли заказчика, а эксперты — агентства. Молодые участники наблюдали, как профессионалы обосновывают предложения, отвечают на вопросы и защищают идеи перед клиентом.</p>\n<h4>Что реализовали</h4><p><strong>Два выпуска молодёжного трека:</strong> каждый со своей программой, объединяющей экспертные выступления и практическое участие студентов.</p>\n<div class=\"case-role\"><h4>Наша роль</h4><p>Инициатива, концепция, программа, работа со спикерами и участниками, подготовка материалов и проведение. Молодёжный трек — наша часть большого форума АКОС.</p></div>"},{"title":"Серебряный Лучник","subtitle":"В студенческое жюри — через силу идей","meta":"Конкурсный отбор в студенческое жюри · 2024–2026","body":"\n<p class=\"case-lead\">Пять дней, реальные коммуникационные задачи и новая механика каждый год. Мы превратили отбор в студенческое жюри «Серебряного Лучника» в самостоятельный креативный проект.</p>\n<h4>С чего всё началось</h4><p>Студенческое жюри появилось на премии в 2023 году, чтобы добавить молодёжный взгляд на проекты номинантов. Тогда представителей направляли кафедры вузов.</p><p>С 2024 года cultcomms разрабатывает конкурсные механики отбора. Теперь место в жюри зависит от качества решений участника, а не от выдвижения кафедрой.</p>\n<h4>Задача</h4><p>Познакомить студентов с премией и профессиональной практикой, привлечь мотивированных участников и сформировать жюри, способное аргументированно оценивать коммуникационные проекты.</p>\n<h4 class=\"case-year\">2026 · Дарк-фэнтези и карты тактики</h4><p>Участники попадали во фракции гномов, призраков, гигантов, колдунов и эльфов. Фракция определяла сюжет задания, но каждый студент работал самостоятельно.</p><p>Сначала участники решали основной кейс. Затем получали карту тактики — осложнение, которое требовало пересмотреть решение.</p><p>Например, эльфы организовывали премию «Серебряный Лучник» в своей реальности. Но в день события на площадке полностью отключался свет. Нужно было предложить, как действовать в новых условиях.</p><p>Дальше студенты придумывали собственные карты тактики. В финале эти карты случайным образом доставались другим участникам — и становились новым заданием.</p><p class=\"case-statline\">5 дней · 96 регистраций · 53 участника · 15 человек в жюри</p>\n<h4 class=\"case-year\">2025 · Два вращения — один неожиданный бриф</h4><p>Первое вращение колеса определяло компанию и её проблему. Второе — целевую аудиторию, для которой нужно разработать коммуникацию.</p><p>Получив комбинацию, участник придумывал решение. На одно задание отводилось пять дней.</p><p class=\"case-statline\">5 дней · около 30 участников · 15 человек в жюри</p>\n<h4 class=\"case-year\">2024 · Пять дней, пять кейсов</h4><p>Первый выпуск конкурсного отбора построили как марафон. Каждый день студенты получали новое задание, тесно связанное с реальной коммуникационной практикой.</p><p class=\"case-statline\">5 дней · 5 заданий · 30 участников · 15 человек в жюри</p>\n<h4>Как выбирали лучших</h4><p>Работы оценивала команда из 3–5 организаторов по четырём критериям:</p><p class=\"case-statline\">Креатив · Визуал · Соответствие «Лучнику» · Проработанность</p><p>По итогам каждого отбора формировали студенческое жюри из 15 человек. Отобранные участники оценивали проекты премии и определяли своих победителей.</p>\n<div class=\"case-role\"><h4>Наша роль</h4><p>Разработка механики и заданий, продвижение отбора, привлечение студентов, оценка работ, формирование и сопровождение студенческого жюри.</p><p>Организация самой премии — на стороне «Серебряного Лучника». Наша задача — сделать путь молодого участника к ней содержательным, открытым и увлекательным.</p></div>"}];const titles=caseContent.map(c=>c.title);
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg>';

 dialog.innerHTML='<div class="folder-sheet"><div class="folder-sheet-content"><div class="folder-sheet-top"><span>'+caseContent[index].meta+'</span><button class="folder-close" type="button" aria-label="Закрыть папку">×</button></div><h3 id="folder-case-heading">'+caseContent[index].subtitle+'</h3><div class="case-story">'+caseContent[index].body+'</div><h4 class="case-media-title">Фотографии проекта</h4><p class="case-media-note">Фотографии добавим позже.</p><div class="folder-photos" aria-label="Места для будущих фотографий"><div class="folder-photo-placeholder">Основная фотография</div><div class="folder-photo-placeholder">Деталь проекта</div></div></div><div class="folder-opening-cover" aria-hidden="true">'+titles[index]+'</div></div>';
